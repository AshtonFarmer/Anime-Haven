name: Validate KageNexus release 62

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check runtime JavaScript syntax
        run: |
          node --check bootstrap-v4.js
          node --check performance-runtime-v62.js
          node --check kagenexus-brand-v19.js
          node --check luffy-search-v35.js
          node --check nav-scroll-guard-v13.js
          node --check library-manager-v15.js
          node --check library-dialog-sync-v61.js
          node --check mobile-suite-loader-v22.js
          node --check arsenal-v34.js
          node --check up-next-v62.js
          node --check arsenal-personal-v62.js
          node --check update-manager-v62.js
          node --check sw-v35.js
          node --check assets/js/power-transform-v29.js

      - name: Validate packaged application
        run: |
          cat data/app/anime-haven-v4.part00 data/app/anime-haven-v4.part01 data/app/anime-haven-v4.part02 \
            | tr -d '\r\n\t ' | base64 --decode > /tmp/kagenexus-app.zip
          unzip -t /tmp/kagenexus-app.zip
          unzip -p /tmp/kagenexus-app.zip app-v2.js > /tmp/app-v2.js
          unzip -p /tmp/kagenexus-app.zip data.js > /tmp/data.js
          unzip -p /tmp/kagenexus-app.zip config.js > /tmp/config.js
          node --check /tmp/app-v2.js
          node --check /tmp/data.js
          node --check /tmp/config.js

      - name: Validate mobile suite payload
        run: |
          cat data/mobile-suite/mobile-suite-v22.part00 \
              data/mobile-suite/mobile-suite-v22.part01 \
              data/mobile-suite/mobile-suite-v22.part02 \
              data/mobile-suite/mobile-suite-v22.part03 \
              data/mobile-suite/mobile-suite-v22.part04 \
              data/mobile-suite/mobile-suite-v22.part05a \
              data/mobile-suite/mobile-suite-v22.part05b \
              data/mobile-suite/mobile-suite-v22.part06 \
              data/mobile-suite/mobile-suite-v22.part07 \
            | tr -d '\r\n\t ' | base64 --decode > /tmp/mobile-suite.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/mobile-suite.json').read_text())
          assert isinstance(payload.get('js'), str) and payload['js'].strip()
          assert isinstance(payload.get('css'), str) and payload['css'].strip()
          Path('/tmp/mobile-suite.js').write_text(payload['js'])
          PY
          node --check /tmp/mobile-suite.js

      - name: Validate release and update lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html').read_text()
          mobile = Path('mobile-suite-loader-v22.js').read_text()
          worker = Path('sw-v35.js').read_text()
          updates = Path('update-manager-v62.js').read_text()

          required = [
              './performance-runtime-v62.js?release=62',
              './mobile-suite-loader-v22.js?release=62',
              './up-next-v62.js?release=62',
              './arsenal-personal-v62.js?release=62',
              './update-manager-v62.js?release=62',
          ]
          for value in required:
              assert value in index, value
              assert value in worker, value

          assert 'serviceWorker.register' not in index
          assert "kagenexus-v62-experience-reliability" in worker
          assert "./sw-v35.js?release=61" not in mobile
          assert mobile.count("./sw-v35.js?release=62") >= 5

          install = worker.split("self.addEventListener('install'", 1)[1].split("self.addEventListener('activate'", 1)[0]
          assert 'self.skipWaiting()' not in install
          assert "event.data?.type === 'SKIP_WAITING'" in worker

          for marker in ['registration.waiting', "addEventListener('updatefound'", "addEventListener('controllerchange'", "type:'SKIP_WAITING'"]:
              assert marker in updates, marker
          assert updates.count('window.location.reload()') == 1
          PY

      - name: Validate feature storage isolation and controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          performance = Path('performance-runtime-v62.js').read_text()
          up_next = Path('up-next-v62.js').read_text()
          arsenal = Path('arsenal-personal-v62.js').read_text()

          for value in ["'full'", "'balanced'", "'low'", 'kagenexus-performance-mode', 'kn62PerformanceSettings']:
              assert value in performance, value
          assert "localStorage.setItem(STORAGE_KEY,mode)" in performance

          assert "const STORAGE_KEY='anime-haven-state-v2'" in up_next
          assert 'localStorage.setItem' not in up_next
          assert "item.status==='watching'" in up_next
          assert 'slice(0,3)' in up_next

          for value in ['kagenexus-arsenal-favorites-v1', 'kagenexus-arsenal-recents-v1', 'RANDOM FAVORITE', 'TAP TO RETRY']:
              assert value in arsenal, value
          assert 'anime-haven-state-v2' not in arsenal
          PY

      - name: Validate JSON manifests
        run: |
          python3 -m json.tool manifest.webmanifest > /dev/null
          python3 -m json.tool manifest-v2.webmanifest > /dev/null
          python3 -m json.tool assets/arsenal/media-sources.json > /dev/null
